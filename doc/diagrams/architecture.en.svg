<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Keel runtime architecture</title>
  <desc id="desc">Host container, independent component runtimes, and C ABI event boundary</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="0.55" stop-color="#B125EA"/>
      <stop offset="1" stop-color="#E44857"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#E44857" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E44857" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 30px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 13px; fill: #94A3B8; }
      .h2 { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 17px; font-weight: 600; fill: #E2E8F0; }
      .h3 { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .body { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 11px; fill: #94A3B8; }
      .bodyBright { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 11px; fill: #CBD5E1; }
      .micro { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 9.5px; fill: #64748B; }
      .pillText { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 9.8px; fill: #CBD5E1; }
      .accentText { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 10.5px; fill: #A78BFA; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    ]]></style>
  </defs>

  <rect width="1200" height="840" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="840" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="840" rx="28" fill="url(#glowB)"/>

  <rect x="60" y="42" width="28" height="28" rx="8" fill="url(#accent)"/>
  <text x="100" y="65" class="title">Keel runtime architecture</text>
  <text x="100" y="88" class="subtitle">Host container · independent component runtimes · C ABI event boundary</text>

  <g filter="url(#shadow)">
    <rect x="380" y="112" width="440" height="76" rx="16" fill="#131F37" stroke="#2B3B58"/>
    <text x="600" y="143" text-anchor="middle" class="h2 mono">keel-launcher</text>
    <text x="600" y="165" text-anchor="middle" class="body">Single-file distribution · host, component manifests, native libraries, resources</text>
  </g>

  <line x1="600" y1="188" x2="600" y2="218" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="207" class="accentText">static link / unpack fallback</text>

  <g filter="url(#shadow)">
    <rect x="60" y="220" width="1080" height="260" rx="20" fill="#0E1830" stroke="#2B3B58"/>
    <rect x="60" y="220" width="1080" height="4" rx="2" fill="url(#accent)"/>
    <text x="92" y="261" class="h2">keel-host · host runtime</text>
    <rect x="930" y="242" width="180" height="28" rx="14" fill="#162443" stroke="#2E4166"/>
    <text x="1020" y="261" text-anchor="middle" class="pillText">Kotlin/Native runtime A</text>

    <rect x="90" y="292" width="190" height="92" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="110" y="320" class="h3">CLI / console</text>
    <text x="110" y="344" class="body">arguments · commands</text>
    <text x="110" y="361" class="body">graceful shutdown</text>

    <rect x="300" y="292" width="190" height="92" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="320" y="320" class="h3">Plugin loader</text>
    <text x="320" y="344" class="body">.keel scan · manifest check</text>
    <text x="320" y="361" class="body">extract · resource registry</text>

    <rect x="510" y="292" width="190" height="92" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="530" y="320" class="h3">Lifecycle</text>
    <text x="530" y="344" class="body">START · COMPLETE</text>
    <text x="530" y="361" class="body">SHUTDOWN</text>

    <rect x="720" y="292" width="190" height="92" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="740" y="320" class="h3">Route table</text>
    <text x="740" y="344" class="body">method + path · routeId</text>
    <text x="740" y="361" class="body">component owner</text>

    <rect x="930" y="292" width="190" height="92" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="950" y="320" class="h3">Ktor CIO</text>
    <text x="950" y="344" class="body">single port · middleware</text>
    <text x="950" y="361" class="body">access log</text>

    <rect x="90" y="408" width="1020" height="50" rx="12" fill="#152341" stroke="#3B4F73"/>
    <circle cx="110" cy="433" r="4" fill="#34D399"/>
    <text x="126" y="437" class="h3">Event pump thread</text>
    <text x="258" y="437" class="bodyBright">host inbox · log aggregation / event forwarding / request replies / timer wakeup</text>
  </g>

  <line x1="260" y1="480" x2="260" y2="538" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="480" x2="600" y2="538" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="480" x2="940" y2="538" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="492" width="460" height="26" rx="13" fill="#1A1240" stroke="#4C1D95"/>
  <text x="600" y="509" text-anchor="middle" class="accentText">C ABI · event queue + opaque handles · blittable types only</text>

  <g filter="url(#shadow)">
    <rect x="60" y="540" width="340" height="150" rx="18" fill="#101C35" stroke="#2B3B58"/>
    <rect x="80" y="540" width="64" height="3" rx="1.5" fill="#8B5CF6"/>
    <text x="80" y="580" class="h3 mono">keel-plugin-hello</text>
    <text x="80" y="602" class="body">own Kotlin/Native runtime B</text>
    <rect x="80" y="618" width="100" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="130" y="634" text-anchor="middle" class="pillText">worker thread</text>
    <rect x="190" y="618" width="90" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="235" y="634" text-anchor="middle" class="pillText">inbox 256</text>
    <rect x="80" y="650" width="230" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="195" y="666" text-anchor="middle" class="pillText">lifecycle · routes · scheduler</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="540" width="340" height="150" rx="18" fill="#101C35" stroke="#2B3B58"/>
    <rect x="450" y="540" width="64" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="450" y="580" class="h3 mono">keel-plugin-{id}</text>
    <text x="450" y="602" class="body">own Kotlin/Native runtime</text>
    <rect x="450" y="618" width="100" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="500" y="634" text-anchor="middle" class="pillText">worker thread</text>
    <rect x="560" y="618" width="90" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="605" y="634" text-anchor="middle" class="pillText">inbox 256</text>
    <rect x="450" y="650" width="230" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="565" y="666" text-anchor="middle" class="pillText">lifecycle · routes · scheduler</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="540" width="340" height="150" rx="18" fill="#101C35" stroke="#2B3B58"/>
    <rect x="820" y="540" width="64" height="3" rx="1.5" fill="#FBBF24"/>
    <text x="820" y="580" class="h3 mono">keel-plugin-...</text>
    <text x="820" y="602" class="body">own Kotlin/Native runtime</text>
    <rect x="820" y="618" width="100" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="870" y="634" text-anchor="middle" class="pillText">worker thread</text>
    <rect x="930" y="618" width="90" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="975" y="634" text-anchor="middle" class="pillText">inbox 256</text>
    <rect x="820" y="650" width="230" height="24" rx="12" fill="#162443" stroke="#2E4166"/>
    <text x="935" y="666" text-anchor="middle" class="pillText">lifecycle · routes · scheduler</text>
  </g>

  <rect x="60" y="718" width="1080" height="86" rx="16" fill="#0B1428" stroke="#243451" stroke-dasharray="6 6"/>
  <text x="90" y="746" class="h3">Build-time toolchain</text>
  <rect x="80" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="157" y="779" text-anchor="middle" class="pillText">classpath embedding</text>
  <rect x="255" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="332" y="779" text-anchor="middle" class="pillText">.keel packaging</text>
  <rect x="430" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="507" y="779" text-anchor="middle" class="pillText">ABI static library</text>
  <rect x="605" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="682" y="779" text-anchor="middle" class="pillText">log call-site rewrite</text>
  <rect x="780" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="857" y="779" text-anchor="middle" class="pillText">KSP worker entry</text>
  <rect x="955" y="762" width="155" height="26" rx="13" fill="#111C33" stroke="#2B3B58"/>
  <text x="1032" y="779" text-anchor="middle" class="pillText">route table generation</text>
</svg>
