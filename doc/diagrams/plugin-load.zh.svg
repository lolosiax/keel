<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">组件加载与启动流程</title>
  <desc id="desc">从 .keel 包到可服务组件的完整链路</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="0.55" stop-color="#B125EA"/>
      <stop offset="1" stop-color="#E44857"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#E44857" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E44857" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #94A3B8; }
      .h3 { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .body { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .micro { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 9.5px; fill: #64748B; }
      .step { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 10.5px; font-weight: 700; fill: #E2E8F0; }
      .accentText { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #A78BFA; }
      .finalText { font-family: Inter, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 600; fill: #D1FAE5; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    ]]></style>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="800" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="800" rx="28" fill="url(#glowB)"/>

  <rect x="60" y="42" width="28" height="28" rx="8" fill="url(#accent)"/>
  <text x="100" y="65" class="title">组件加载与启动流程</text>
  <text x="100" y="88" class="subtitle">从 .keel 包到可服务组件的完整链路</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="240" height="96" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="84" cy="170" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="84" y="174" text-anchor="middle" class="step">1</text>
    <text x="108" y="175" class="h3">.keel 扫描</text>
    <text x="80" y="204" class="body">按文件名排序</text>
    <text x="80" y="221" class="body">逐个读取组件包</text>

    <rect x="320" y="140" width="240" height="96" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="344" cy="170" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="344" y="174" text-anchor="middle" class="step">2</text>
    <text x="368" y="175" class="h3">清单校验</text>
    <text x="340" y="204" class="body">id · abiVersion · entry</text>
    <text x="340" y="221" class="body">当前目标库 · 重复 id</text>

    <rect x="580" y="140" width="240" height="96" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="604" cy="170" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="604" y="174" text-anchor="middle" class="step">3</text>
    <text x="628" y="175" class="h3">动态库解包</text>
    <text x="600" y="204" class="body">缓存目录 id/version</text>
    <text x="600" y="221" class="body">不覆盖正在使用的库</text>

    <rect x="840" y="140" width="240" height="96" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="864" cy="170" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="864" y="174" text-anchor="middle" class="step">4</text>
    <text x="888" y="175" class="h3">资源注册</text>
    <text x="860" y="204" class="body">resources/ 进入注册表</text>
    <text x="860" y="221" class="body">获得带代次的引用</text>
  </g>

  <line x1="300" y1="188" x2="316" y2="188" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="188" x2="576" y2="188" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="188" x2="836" y2="188" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 960 236 V 266 H 600 V 296" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="780" y="258" text-anchor="middle" class="accentText">dlopen / LoadLibrary</text>

  <g filter="url(#shadow)">
    <rect x="340" y="300" width="520" height="80" rx="16" fill="#131F37" stroke="#2B3B58"/>
    <text x="600" y="335" text-anchor="middle" class="h3 mono">keel_plugin_bootstrap</text>
    <text x="600" y="359" text-anchor="middle" class="body">创建 Worker 线程与 256 条收件箱</text>
  </g>

  <line x1="600" y1="380" x2="600" y2="416" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="420" width="1080" height="200" rx="20" fill="#0E1830" stroke="#2B3B58"/>
    <rect x="60" y="420" width="1080" height="4" rx="2" fill="url(#accent)"/>
    <text x="90" y="456" class="h3">组件 Worker 线程 · 首次进入插件 Kotlin 运行时</text>

    <rect x="90" y="480" width="310" height="100" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="110" y="512" class="h3 mono">START</text>
    <text x="110" y="536" class="body">事件泵线程收到启动命令</text>

    <rect x="420" y="480" width="310" height="100" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="440" y="512" class="h3 mono">onLoad → onEnable</text>
    <text x="440" y="536" class="body">构造 @KeelPluginMain 实例</text>

    <rect x="750" y="480" width="360" height="100" rx="12" fill="#111C33" stroke="#253653"/>
    <text x="770" y="512" class="h3 mono">COMPLETE</text>
    <text x="770" y="536" class="body">把启动结果回投宿主收件箱</text>
  </g>

  <line x1="400" y1="530" x2="416" y2="530" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="530" x2="746" y2="530" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="620" x2="600" y2="656" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="300" y="660" width="600" height="64" rx="32" fill="#12203A" stroke="#34D399"/>
    <circle cx="330" cy="692" r="4" fill="#34D399"/>
    <text x="612" y="697" text-anchor="middle" class="finalText">宿主登记 plugin_id · 按 requires 拓扑启动 · 进入可服务状态</text>
  </g>

  <text x="600" y="756" text-anchor="middle" class="body">单个组件失败只记录一条失败原因，不中断宿主与其他组件</text>
</svg>
