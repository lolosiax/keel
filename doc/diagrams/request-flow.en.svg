<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">HTTP request flow</title>
  <desc id="desc">Ktor coroutines and the component worker exchange request and reply through the event pump</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="0.55" stop-color="#B125EA"/>
      <stop offset="1" stop-color="#E44857"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#E44857" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E44857" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
    </marker>
    <style><![CDATA[
      .title { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 30px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 13px; fill: #94A3B8; }
      .h3 { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .body { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .micro { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 9.5px; fill: #64748B; }
      .step { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 10.5px; font-weight: 700; fill: #E2E8F0; }
      .accentText { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 10px; fill: #A78BFA; }
      .greenText { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; font-size: 10px; fill: #34D399; }
    ]]></style>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="800" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="800" rx="28" fill="url(#glowB)"/>

  <rect x="60" y="42" width="28" height="28" rx="8" fill="url(#accent)"/>
  <text x="100" y="65" class="title">HTTP request flow</text>
  <text x="100" y="88" class="subtitle">Ktor coroutines and the component worker exchange request and reply through the event pump</text>

  <rect x="80" y="108" width="480" height="44" rx="22" fill="#111C33" stroke="#2B3B58"/>
  <circle cx="106" cy="130" r="4" fill="#8B5CF6"/>
  <text x="120" y="135" class="h3">Host runtime · Ktor + event pump</text>
  <rect x="640" y="108" width="480" height="44" rx="22" fill="#111C33" stroke="#2B3B58"/>
  <circle cx="666" cy="130" r="4" fill="#22D3EE"/>
  <text x="680" y="135" class="h3">Component runtime · worker thread</text>

  <line x1="600" y1="108" x2="600" y2="720" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 8"/>

  <line x1="320" y1="244" x2="320" y2="276" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="354" x2="320" y2="386" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="427" x2="676" y2="427" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="464" x2="880" y2="496" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="537" x2="524" y2="537" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="320" y1="574" x2="320" y2="616" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="600" y="416" text-anchor="middle" class="accentText">COMMAND · C ABI · correlation=N</text>
  <text x="600" y="526" text-anchor="middle" class="greenText">COMPLETE · C ABI · correlation=N</text>

  <g filter="url(#shadow)">
    <rect x="120" y="170" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="102" cy="207" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="102" y="211" text-anchor="middle" class="step">1</text>
    <text x="140" y="201" class="h3">Client HTTP request</text>
    <text x="140" y="223" class="body">method · path · body</text>

    <rect x="120" y="280" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="102" cy="317" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="102" y="321" text-anchor="middle" class="step">2</text>
    <text x="140" y="311" class="h3">Ktor CIO single port</text>
    <text x="140" y="333" class="body">capture HttpRequest snapshot</text>

    <rect x="120" y="390" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="102" cy="427" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="102" y="431" text-anchor="middle" class="step">3</text>
    <text x="140" y="421" class="h3">Host route table</text>
    <text x="140" y="443" class="body">resolve pluginId + routeId</text>

    <rect x="680" y="390" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="662" cy="427" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="662" y="431" text-anchor="middle" class="step">4</text>
    <text x="700" y="421" class="h3">Component worker thread</text>
    <text x="700" y="443" class="body">decode HttpRouteRequest</text>

    <rect x="680" y="500" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="662" cy="537" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="662" y="541" text-anchor="middle" class="step">5</text>
    <text x="700" y="531" class="h3">Run handler</text>
    <text x="700" y="553" class="body">local route table · build HttpResponse</text>

    <rect x="120" y="500" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="102" cy="537" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="102" y="541" text-anchor="middle" class="step">6</text>
    <text x="140" y="531" class="h3">Host event pump</text>
    <text x="140" y="553" class="body">resume suspended Ktor coroutine by correlation</text>

    <rect x="120" y="620" width="400" height="74" rx="14" fill="#111C33" stroke="#253653"/>
    <circle cx="102" cy="657" r="11" fill="#1E293B" stroke="#475569"/>
    <text x="102" y="661" text-anchor="middle" class="step">7</text>
    <text x="140" y="651" class="h3">Client HTTP response</text>
    <text x="140" y="673" class="body">status · contentType · body</text>
  </g>

  <line x1="120" y1="720" x2="1080" y2="720" stroke="#1E293B"/>
  <text x="120" y="746" class="body">ApplicationCall and Continuation stay inside the host runtime</text>
  <text x="680" y="746" class="body">Kotlin objects and coroutines never cross the ABI</text>
</svg>
